spring.datasource.username=root
spring.datasource.password=forgot
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost/hostel-management?useSSS=false&serverTimeZone=UTC&createDatabaseIfNotExist=true&zeroDateTimeBehavior=convertToNull
spring.datasource.url=jdbc:mariadb://localhost:3306/hostel_management
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
logging.level.root=info
server.servlet.context-path=/api
server.port=80
config.cities-max-page-size=20
spring.threads.virtual.enabled=true
#pool size = Tn x (Cm - 1) + 1, Tn -> no of threads, Cm -> no of simultaneous connections per thread
spring.datasource.hikari.maximum-pool-size=121
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=1800000